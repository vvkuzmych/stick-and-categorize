# STICK-1 Phase 4: Hardening and packaging — C4 Architecture

This page shows what Phase 4 adds so the system survives a normal day on a clean Mac: the backend starts by itself, the app waits for it, and the app can be signed and shipped. Chosen option: a per-user macOS LaunchAgent (a background job managed by macOS) for the backend, and a small retry loop in the app.

## The idea in 30 seconds

**Problem.** Today the backend runs only when a developer starts it by hand (`README.md:23-25`), and the app checks it once at launch. If the backend is not up yet, the app shows an error and stops trying (`mac/stick/app.py:100-102`, `mac/stick/app.py:171`). The backend writes no log of its own (a search of `backend/app` for `logging` finds nothing), and the app bundle is built but not signed (`mac/packaging/setup.py:1-18` has no signing step).

**Principle.** Nothing should need a human to start it, and nothing should fail silently. Background jobs are started and restarted by macOS, and the app always says what state the backend is in.

**Result.** After login the backend is already running. If the app starts first or the backend restarts, the app shows "backend offline" and reconnects by itself. A signed and notarized app can be installed on a clean Mac by following the README.

The system itself does not change shape. Two new outside parties appear: macOS now starts part of it at login, and Apple's notary service checks the app at release time. Notarization is Apple's malware check that lets the app open without warnings.

- Recording, upload and stickies work as before. A voice note still keeps its id across retries.
- Launch Sync no longer runs only once: it runs again whenever the backend comes back.
- The menu status shows "backend offline" or "Ready" from the monitor, instead of an error that stays on screen.

## New elements (green boxes)

Every green box on Levels 2 and 3 has one card below. The README and manual test checklist from the plan are documents, not boxes, so they have no card.

<div class="cards">
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Backend LaunchAgent</h3>
<p class="what"><b>What it is.</b> A small config file (a <code>.plist</code>) that tells macOS to start the backend when the user logs in and to start it again if it stops.</p>
<p class="why"><b>Why we add it.</b> The backend has to be started by hand today: the README shows a manual <code>uvicorn</code> command (<code>README.md:23-25</code>), and no <code>.plist</code> or start script exists in the repo (a search finds none). After a restart the app would open with no backend.</p>
<p><b>How it works.</b></p>
<ul>
<li>Runs the backend's own Python with <code>uvicorn app.main:app</code>.</li>
<li>Starts at login and restarts after a crash.</li>
<li>Sets <code>DATABASE_URL</code> and writes output to a log file.</li>
</ul>
<p class="where"><b>Where.</b> <code>deploy/dev.stick.backend.plist</code> and an install step in the README (planned paths). Installed in <code>~/Library/LaunchAgents/</code>.</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Backend Logging</h3>
<p class="what"><b>What it is.</b> Log lines from the backend: startup, model load, each request and each error.</p>
<p class="why"><b>Why we add it.</b> The backend has no logging setup (a search of <code>backend/app</code> for <code>logging</code> finds nothing). Once it runs in the background there is no terminal, so a failed upload leaves no trace.</p>
<p><b>How it works.</b></p>
<ul>
<li>Writes to standard output, which the LaunchAgent sends to a log file.</li>
<li>Logs the note id, the result and the time taken for voice uploads. It does not log the note text.</li>
<li>Log level is set by an environment variable.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/logging.py</code> (planned path), set up in <code>backend/app/main.py</code>.</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Release Script</h3>
<p class="what"><b>What it is.</b> A script that builds the app, signs it with a developer certificate, sends it to Apple for notarization and attaches the result (stapling).</p>
<p class="why"><b>Why we add it.</b> The build makes <code>Stick.app</code> but nothing signs it (<code>mac/packaging/setup.py:1-18</code>). macOS ties the microphone permission to a properly signed app, and an unsigned app is blocked or warned about on other Macs.</p>
<p><b>How it works.</b></p>
<ul>
<li>Runs the py2app build, then signs the bundle with the hardened runtime.</li>
<li>Submits to Apple's notary service and waits for the answer.</li>
<li>Staples the ticket so the app opens offline. Certificate and credentials come from the developer's keychain, never from the repo.</li>
</ul>
<p class="where"><b>Where.</b> <code>mac/packaging/release.sh</code> (planned path). Needs an Apple Developer account: not verified that one exists.</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Connection Monitor</h3>
<p class="what"><b>What it is.</b> A small loop in the app that checks whether the backend answers and tells the rest of the app.</p>
<p class="why"><b>Why we add it.</b> The app asks the backend once at launch and, on failure, shows the error and stops (<code>mac/stick/app.py:100-102</code>, <code>mac/stick/app.py:171</code>). Retries exist only inside one upload (<code>mac/stick/api.py:12</code>, <code>api.py:78-83</code>). If the app starts before the backend, no stickies appear until the user relaunches.</p>
<p><b>How it works.</b></p>
<ul>
<li>Calls <code>GET /health</code> every few seconds while offline, and less often while online. The intervals are not set in the plan.</li>
<li>Offline: the menu shows "backend offline". Online again: it triggers Launch Sync.</li>
<li>Runs in a background thread and never blocks the hotkey.</li>
</ul>
<p class="where"><b>Where.</b> <code>mac/stick/connection.py</code> (planned path), started from <code>mac/stick/app.py</code>.</p>
</div>
</div>
