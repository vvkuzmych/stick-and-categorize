# STICK-1 Phase 0: Risk spikes and skeleton — C4 Architecture

This page shows what Phase 0 adds to the repository: three small experiments and an empty project skeleton. Chosen option: Python everywhere (PyObjC for the Mac app), with Swift only as a fallback if the desktop-window spike fails.

## The idea in 30 seconds

**Problem.** Two things could break the whole design: a Python window may not sit on the desktop the way a sticky should, and speech-to-text may be too slow or too heavy on the Mac. Today the repo has one spike script (`mac/spikes/panel_spike.py`, untracked) and a one-line `README.md` (`README.md:2`). There is no backend, no database and no measurement.

**Principle.** Test the risky parts first, in throwaway code, before building on them. Each experiment must end with a number or a visible result.

**Result.** After Phase 0 we know if Python works for the Mac app and how fast Whisper runs here. The `backend/` and `mac/` folders and a local database are ready for Phase 1.

- Already written: a first Sticky Panel script that draws two hard-coded stickies (`mac/spikes/panel_spike.py:61-76`). It has not been confirmed to survive a Space switch.
- Still to write: the hotkey, the recorder and the py2app build. None of them exists yet.
- All code here is throwaway. Phase 3 rebuilds the good parts inside the real app.

## New elements (green boxes)

Every green box on Levels 2 and 3 has one card below. The repo has no other code to compare with, so most evidence is "this does not exist yet".

<div class="cards">
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Mac package</h3>
<p class="what"><b>What it is.</b> The <code>mac/</code> folder: a Python package for the future desktop app. In Phase 0 it holds only the spikes.</p>
<p class="why"><b>Why we add it.</b> The only Mac code is one loose script under <code>mac/spikes/</code>, with no package, no dependencies file and no build setup (<code>ls mac</code> shows only <code>spikes/</code>). Phase 3 needs a proper place to grow.</p>
<p><b>How it works.</b></p>
<ul>
<li>Python package with PyObjC (Python access to Apple's AppKit) as its main dependency.</li>
<li>Spikes live in <code>mac/spikes/</code> and are run by hand.</li>
<li>py2app (a tool that builds a Mac app from Python) is added for the packaging check.</li>
</ul>
<p class="where"><b>Where.</b> <code>mac/</code>, with a <code>pyproject.toml</code> (planned path).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Backend skeleton</h3>
<p class="what"><b>What it is.</b> An empty but runnable <code>backend/</code> project: FastAPI app, pytest, ruff (a code linter) and a Python 3.13 pin.</p>
<p class="why"><b>Why we add it.</b> There is no server code or Python project file in the repo (<code>git ls-files</code> lists only <code>.gitignore</code> and <code>README.md</code>). Phase 1 starts with tests, so the test setup must exist first.</p>
<p><b>How it works.</b></p>
<ul>
<li><code>pyproject.toml</code> pins Python 3.13. Python 3.15 is avoided because <code>av</code> has no build for it (plan, Phase 0).</li>
<li>The <code>av</code> version must be pinned: 19.0.2 fails with faster-whisper 1.2.1. Which version works is not verified.</li>
<li><code>.env.example</code> lists the settings, such as the database URL.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/</code> and <code>.env.example</code> (planned paths).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Spike B: Whisper timing</h3>
<p class="what"><b>What it is.</b> A short script that runs faster-whisper on a recorded 5-second clip and prints time and text.</p>
<p class="why"><b>Why we add it.</b> Speed and accuracy of speech-to-text on this Mac are unknown, and the whole voice flow depends on them. No speech code exists (<code>git ls-files</code>). A synthetic 8.8 s clip took 1.3 s with model <code>small</code> (plan, Spike C); real microphone audio and accents are not tested.</p>
<p><b>How it works.</b></p>
<ul>
<li>Load the model once, transcribe the clip, record model size, time and a word-level accuracy note.</li>
<li>If too slow: try a smaller model, or plan a cloud Transcriber behind the same interface.</li>
</ul>
<p class="where"><b>Where.</b> A script under <code>backend/</code> (exact path not decided in the plan). Throwaway: Phase 2 builds the real Transcriber from it.</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Spike C: memory check</h3>
<p class="what"><b>What it is.</b> A measurement of memory use when Whisper and a 3B-parameter Ollama model run together.</p>
<p class="why"><b>Why we add it.</b> The plan wants speech and (later) an LLM on the same 16 GB Mac. Without a number we cannot tell if Phase 5 fits. The repo has no measurement or record of one (<code>git ls-files</code>).</p>
<p><b>How it works.</b></p>
<ul>
<li>Measured on an M1 Pro, 16 GB: Whisper <code>small</code> about 0.8 GB; <code>llama3.2:3b</code> 2.6 GB.</li>
<li>Both loaded: system memory used rose from about 6.3 GB to 8.3 GB, with 25% free.</li>
<li>Result is only written down. It needs no code in the app.</li>
</ul>
<p class="where"><b>Where.</b> Results stay in the implementation plan (<code>.scratch/stick-1/implementation-plan.md</code>). No script is committed.</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Local PostgreSQL</h3>
<p class="what"><b>What it is.</b> A PostgreSQL database that runs on the developer's Mac.</p>
<p class="why"><b>Why we add it.</b> Phase 1 tests must run against a real PostgreSQL (plan, Phase 1), and none is set up: the repo has no compose file or database setting (<code>git ls-files</code>).</p>
<p><b>How it works.</b></p>
<ul>
<li>Started with docker compose or Homebrew; the plan has not chosen one.</li>
<li>Connection string comes from <code>.env</code>, copied from <code>.env.example</code>.</li>
<li>No tables yet. The first schema arrives with the Phase 1 migration.</li>
</ul>
<p class="where"><b>Where.</b> <code>docker-compose.yml</code> if docker is chosen (planned path).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Sticky Panel</h3>
<p class="what"><b>What it is.</b> A small borderless window (<code>NSPanel</code>, a lightweight AppKit window) with hard-coded text, placed on the desktop.</p>
<p class="why"><b>Why we add it.</b> The whole product is "a sticky on the desktop". If Python cannot make a window that sits under normal windows and shows on every Space, the stack changes to Swift. The first script exists but its Space-switch behaviour is not confirmed (<code>mac/spikes/panel_spike.py:41-46</code>).</p>
<p><b>How it works.</b></p>
<ul>
<li>Window level is "desktop icon level + 1": above icons, below normal windows (<code>panel_spike.py:41</code>).</li>
<li>Collection behaviour joins all Spaces, stays put, and is skipped by window cycling (<code>panel_spike.py:42-46</code>).</li>
<li>Accessory activation policy hides the Dock icon (<code>panel_spike.py:64</code>).</li>
<li>Check by hand: switch Spaces and see that the stickies stay.</li>
</ul>
<p class="where"><b>Where.</b> <code>mac/spikes/panel_spike.py</code> (exists, untracked).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Global Hotkey</h3>
<p class="what"><b>What it is.</b> A key combination that works in any app and starts or stops recording.</p>
<p class="why"><b>Why we add it.</b> The user flow is "press a key and speak". The spike script has no hotkey code (<code>grep -i hotkey mac</code> finds nothing), and Python's ability to catch a global key on macOS is unproven.</p>
<p><b>How it works.</b></p>
<ul>
<li>Register one key combination while the app is in the background.</li>
<li>Press once to start, again to stop. It only prints a message in Phase 0.</li>
<li>Note any permission macOS asks for. Which one is not verified.</li>
</ul>
<p class="where"><b>Where.</b> A new file in <code>mac/spikes/</code> (planned path).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Mic Recorder</h3>
<p class="what"><b>What it is.</b> Code that records microphone audio to a file using AVAudioEngine (Apple's audio API).</p>
<p class="why"><b>Why we add it.</b> Voice notes need real audio, and Spike B needs a real clip. Only synthetic speech made with <code>say</code> has been tested (plan, Spike C). No recording code exists (<code>grep -i AVAudio mac</code> finds nothing).</p>
<p><b>How it works.</b></p>
<ul>
<li>Record about 5 seconds from the default microphone and save a file Whisper can read.</li>
<li>Ask for microphone permission and note what the user sees.</li>
<li>The saved clip becomes the input of Spike B.</li>
</ul>
<p class="where"><b>Where.</b> A new file in <code>mac/spikes/</code> (planned path).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>py2app Bundle</h3>
<p class="what"><b>What it is.</b> A build of the spike as a real <code>.app</code> using py2app.</p>
<p class="why"><b>Why we add it.</b> macOS ties microphone permission to the app bundle. A script run from the terminal may behave differently from a packaged app, and no packaging setup exists (<code>grep -i py2app mac</code> finds nothing).</p>
<p><b>How it works.</b></p>
<ul>
<li>Build the panel and recorder into an app.</li>
<li>Launch it and check that macOS shows the microphone prompt.</li>
<li>Signing and notarizing are not part of this check. They come in Phase 4.</li>
</ul>
<p class="where"><b>Where.</b> <code>mac/</code> build config (planned path).</p>
</div>
</div>
