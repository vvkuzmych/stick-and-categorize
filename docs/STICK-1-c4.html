# STICK-1: Voice stickies on the Mac desktop — C4 Architecture

This page shows how a spoken note becomes a sticky on the macOS desktop, and how it gets a category when the user asks for one. Chosen option: Python everywhere: a PyObjC desktop app, a FastAPI backend, PostgreSQL.

## The idea in 30 seconds

**Problem.** The repository holds only a `.gitignore` and a one-line `README.md` ("Make sticks and categorize them", `README.md:2`). There is no way to capture a voice note, store it, or show it on the desktop.

**Principle.** The Mac app only records audio and draws stickies. All decisions (text, category, storage) live in the Python backend, and PostgreSQL is the single source of truth.

**Result.** The user presses a hotkey and speaks. A sticky appears on the desktop within seconds. If the user said "in category Work", the sticky is filed under Work. After a restart, the app redraws every sticky from the database.

- Nothing exists today, so nothing keeps working "as before". Every box is new.
- A note is categorized only when the spoken text asks for it. Otherwise the sticky has no category.
- Restart safety: the app asks the backend for all notes on launch, so stickies come back from PostgreSQL.

## New elements (green boxes)

Every green box on Levels 2 and 3 has one card below. The evidence for every "Why" is the same: the repo is empty, so each element is needed from the start.

<div class="cards">
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Sticky Desktop App</h3>
<p class="what"><b>What it is.</b> A macOS menu-bar app written in Python. It uses PyObjC (Python access to Apple's AppKit) to record the voice and draws each sticky as a small borderless window on the desktop.</p>
<p class="why"><b>Why we add it.</b> Nothing in the repo can record audio or draw on the desktop: only <code>.gitignore</code> and <code>README.md</code> are tracked (<code>git ls-files</code>), and the goal is written only as "Make sticks and categorize them" (<code>README.md:2</code>).</p>
<p><b>How it works.</b></p>
<ul>
<li>A global hotkey starts and stops recording (AVFoundation through PyObjC). The app sends the audio with a client-made note id to the backend.</li>
<li>Each sticky is an AppKit <code>NSPanel</code> with a text view, created from Python. It sits at desktop level, so other windows cover it, and it shows on every Space.</li>
<li>On launch the app loads all notes from the backend and redraws them. A login item starts it at sign-in.</li>
<li>Why Python: one language and one toolchain for the whole project. Risk: PyObjC has thinner docs and fiddlier packaging (py2app) and signing. Swift is the fallback if the phase 0 spike fails.</li>
</ul>
<p class="where"><b>Where.</b> New Python package <code>mac/</code>, packaged with py2app (planned path).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Backend API</h3>
<p class="what"><b>What it is.</b> A Python web service (FastAPI) that turns audio into a stored note and returns it to the app.</p>
<p class="why"><b>Why we add it.</b> There is no server code or Python project in the repo (<code>git ls-files</code> shows two files). The brief asks for a Python backend.</p>
<p><b>How it works.</b></p>
<ul>
<li>Exposes a few HTTP endpoints on localhost: upload voice note, list notes, list categories.</li>
<li>Runs the pipeline: transcribe, parse intent, save.</li>
<li>Holds no state of its own. Everything is in PostgreSQL, so a restart loses nothing.</li>
</ul>
<p class="where"><b>Where.</b> New package <code>backend/app/</code> with <code>pyproject.toml</code> (planned path).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>PostgreSQL</h3>
<p class="what"><b>What it is.</b> The database that stores notes and categories.</p>
<p class="why"><b>Why we add it.</b> No schema or storage exists (<code>git ls-files</code>). Stickies must survive an app or Mac restart, so memory alone is not enough.</p>
<p><b>How it works.</b></p>
<ul>
<li>Table <code>categories</code>: id, unique name.</li>
<li>Table <code>notes</code>: id (made by the client), text, nullable category id, created time.</li>
<li>Schema changes go through migrations (Alembic).</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/migrations/</code> (planned path).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Notes Router</h3>
<p class="what"><b>What it is.</b> The HTTP layer of the backend. It checks input and calls the services.</p>
<p class="why"><b>Why we add it.</b> The app has no way to reach the backend: no endpoints exist (<code>git ls-files</code>).</p>
<p><b>How it works.</b></p>
<ul>
<li><code>POST /notes/voice</code> takes audio and a note id.</li>
<li><code>GET /notes</code> and <code>GET /categories</code> return stored data.</li>
<li>Contains no business rules. It only calls the other components.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/api/notes.py</code> (planned path).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Transcriber</h3>
<p class="what"><b>What it is.</b> A small wrapper that converts audio to text.</p>
<p class="why"><b>Why we add it.</b> A voice note is useless as sticky text until it is transcribed, and no speech code exists (<code>git ls-files</code>).</p>
<p><b>How it works.</b></p>
<ul>
<li>One interface: audio in, text out.</li>
<li>First implementation: faster-whisper running on the Mac, so audio stays local (assumed requirement, not confirmed).</li>
<li>A cloud service can replace it later without touching other components.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/speech/transcriber.py</code> (planned path).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Intent Parser</h3>
<p class="what"><b>What it is.</b> Code that reads the transcript and decides whether the user asked for a category.</p>
<p class="why"><b>Why we add it.</b> The brief says notes are categorized only "if the user asked" (user request). Without this step we would either always categorize or never do it.</p>
<p><b>How it works.</b></p>
<ul>
<li>Looks for phrases like "in category Work" or "categorize as Work".</li>
<li>Returns the clean note text and an optional category name.</li>
<li>Rule-based first, so it is fast, free and testable.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/domain/intent.py</code> (planned path).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Note Service</h3>
<p class="what"><b>What it is.</b> The place where a note is created and listed.</p>
<p class="why"><b>Why we add it.</b> The app may retry an upload (for example after a timeout). With no service enforcing one row per note id, a retry would show two identical stickies. No such code exists (<code>git ls-files</code>).</p>
<p><b>How it works.</b></p>
<ul>
<li>Creates a note using the id sent by the app. A repeated id returns the existing note.</li>
<li>Asks Category Service for a category only when Intent Parser found a name.</li>
<li>Lists all notes for the app's launch sync.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/domain/notes.py</code> (planned path).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Category Service</h3>
<p class="what"><b>What it is.</b> Finds a category by name or creates it.</p>
<p class="why"><b>Why we add it.</b> Categories are created by voice, so "Work" and "work" must map to the same row. Nothing handles that today (<code>git ls-files</code>).</p>
<p><b>How it works.</b></p>
<ul>
<li>Matches names ignoring case and extra spaces.</li>
<li>Creates the category if it is new.</li>
<li>Relies on a unique name in PostgreSQL, so two quick requests cannot create duplicates.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/domain/categories.py</code> (planned path).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Repository</h3>
<p class="what"><b>What it is.</b> The only code that talks SQL to PostgreSQL.</p>
<p class="why"><b>Why we add it.</b> No data access exists (<code>git ls-files</code>). Keeping SQL in one place lets the services be tested without a database.</p>
<p><b>How it works.</b></p>
<ul>
<li>SQLAlchemy models for <code>notes</code> and <code>categories</code>.</li>
<li>Small methods: save note, get note, list notes, find or insert category.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/db/</code> (planned path).</p>
</div>
<div class="card t2">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 2</span></div>
<h3>LLM Classifier</h3>
<p class="what"><b>What it is.</b> An adapter that asks an LLM to suggest a category for a note.</p>
<p class="why"><b>Why we add it.</b> Rule-based parsing only catches fixed phrases (see Intent Parser). A user who says "put this with my work stuff" would get no category. No such code exists (<code>git ls-files</code>).</p>
<p><b>How it works.</b></p>
<ul>
<li>Called only when the user asked for a category but the parser found no clear name.</li>
<li>Receives the note text and existing category names. Returns one name.</li>
<li>If the call fails, the sticky is saved without a category.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/llm/classifier.py</code> (planned path). It can wait: the first release works with fixed phrases.</p>
</div>
</div>
