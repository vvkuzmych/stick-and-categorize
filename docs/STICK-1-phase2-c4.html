# STICK-1 Phase 2: Voice pipeline — C4 Architecture

This page shows what Phase 2 adds to the backend: an audio upload that becomes a stored note, with an optional category taken from the spoken words. Chosen option: speech-to-text behind a small interface, a pure rule-based parser, and one new service that runs the steps in order.

## The idea in 30 seconds

**Problem.** The backend accepts only typed text: `POST /notes` takes JSON (`backend/app/api/notes.py:56-62`). There is no speech-to-text code in the app. `faster-whisper` is installed only for the spike (`backend/pyproject.toml:15-16`), and the spike loads the model on every run (`backend/spikes/transcribe_spike.py:16`).

**Principle.** The pipeline is a chain of small parts with simple inputs and outputs: audio → text → (clean text, category) → note. The slow part (speech-to-text) sits behind an interface, so tests use a fake and the real engine can be swapped for a cloud one.

**Result.** A developer uploads a recorded clip with a note id and gets a stored note. If the clip says "in category Work", the note is filed under Work. Bad or empty audio gives a clear error and saves nothing.

- Typed notes keep working as before: `POST /notes`, `GET /notes`, `GET /categories`, and Note Service and Category Service stay as they are. A repeated note id still returns the stored note.
- The voice path reuses Note Service to save, so it gets the same duplicate and category rules.
- Changed: `main.py` loads the model once, and the Notes Router gets one endpoint.

## New elements (green boxes)

Every green box on Level 3 has one card below. Level 2 has no green box.

<div class="cards">
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Transcriber</h3>
<p class="what"><b>What it is.</b> A small interface: audio in, text out. Other code depends on it, not on a specific speech engine.</p>
<p class="why"><b>Why we add it.</b> The only speech code is a spike script that calls <code>WhisperModel</code> directly (<code>backend/spikes/transcribe_spike.py:16-21</code>). If the app did the same, tests would need a real model, and moving to a cloud service would touch every caller.</p>
<p><b>How it works.</b></p>
<ul>
<li>One method that takes an audio file and returns text.</li>
<li>Tests pass a fake that returns fixed text, so most tests run in milliseconds.</li>
<li>A cloud implementation can replace the local one later without other changes.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/speech/transcriber.py</code> (planned path).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Faster-Whisper Transcriber</h3>
<p class="what"><b>What it is.</b> The real Transcriber. It runs the faster-whisper speech model on the Mac, so audio stays local.</p>
<p class="why"><b>Why we add it.</b> The spike loads the model on every run (<code>transcribe_spike.py:16</code>) and the library is only in the optional <code>spikes</code> extra (<code>backend/pyproject.toml:15-16</code>). A server that reloads the model per request would add seconds to each note: loading took 1.1–1.9 s in the Phase 0 runs.</p>
<p><b>How it works.</b></p>
<ul>
<li>Loads the model once at startup and keeps it in memory.</li>
<li>Uses the settings measured in Phase 0: model <code>small</code>, CPU, <code>int8</code>.</li>
<li><code>faster-whisper</code> and the pinned <code>av&lt;19</code> move into the main dependencies.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/speech/faster_whisper.py</code> (planned path), created in <code>main.py</code>.</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Intent Parser</h3>
<p class="what"><b>What it is.</b> A pure function: it reads the transcript and returns the clean note text plus a category name, or none.</p>
<p class="why"><b>Why we add it.</b> Today a category only arrives as a separate JSON field (<code>backend/app/api/notes.py:56-62</code>). Spoken notes have the category inside the sentence, and nothing extracts it: the app has no parsing code.</p>
<p><b>How it works.</b></p>
<ul>
<li>Looks for phrases like "in category Work" and "categorize as Work".</li>
<li>Removes the phrase from the text. Without such a phrase the category stays empty.</li>
<li>No database, no network, so it is covered by table tests with many phrasings and false-positive cases.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/domain/intent.py</code> (planned path).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Audio Limits</h3>
<p class="what"><b>What it is.</b> Checks on an uploaded clip: maximum file size and maximum length, and a clear error for each.</p>
<p class="why"><b>Why we add it.</b> The app has no upload code, so there is no size or length check (<code>grep</code> for <code>UploadFile</code> in <code>backend/app</code> finds nothing). A huge file would be read into memory and sent to the model, which holds the one Whisper instance for as long as it runs.</p>
<p><b>How it works.</b></p>
<ul>
<li>Rejects a file over the size limit before transcribing.</li>
<li>Rejects a clip over the length limit. The limit values are not set in the plan.</li>
<li>Returns an error the client can show, and saves nothing.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/api/limits.py</code> (planned path), used by the Notes Router.</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Voice Note Service</h3>
<p class="what"><b>What it is.</b> The one place that runs the voice steps in order: transcribe, parse, save.</p>
<p class="why"><b>Why we add it.</b> The Notes Router must hold no business rules (Phase 1 design), and Note Service knows only text (<code>backend/app/domain/notes.py:13</code>). Without this service the order of steps and the empty-transcript error would end up in the router. The plan does not name this component: it is a design choice, so confirm it.</p>
<p><b>How it works.</b></p>
<ul>
<li>Calls the Transcriber, then the Intent Parser, then Note Service with the note id.</li>
<li>If the transcript is empty, returns an error and saves nothing.</li>
<li>Tested with a fake Transcriber, so the pipeline test needs no model.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/domain/voice.py</code> (planned path).</p>
</div>
</div>
