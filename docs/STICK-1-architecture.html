# STICK-1: Voice stickies on the Mac desktop — Architecture

Status: as built after Phases 0 to 5 and the changes of 2026-11-04 (automatic categories, Ctrl+Option+R hotkey, delete and drag on stickies, local code signing), plus the risks and open decisions that remain. Recommended option: keep the current two-part design (a Python menu-bar app and a local Python backend with PostgreSQL), and spend the next effort on verification and hardening, not on new structure.

## 1. Summary

**What we are doing.** A Mac menu-bar app records a voice note when the user presses Ctrl+Option+R. A local backend turns the audio into text, finds an optional category, stores the note, and the app shows it as a sticky window on the desktop. All code is Python.

**Recommended option.** Option A: keep the app and the backend as two processes. The app only records, uploads and draws. The backend owns transcription, categories and storage. The category fallback uses Google Gemini and is opt-in: it runs only when the user asked for a category in other words, and only picks an existing category.

**Key risks**
- **Only partly tested by a person.** On 2026-11-04 the owner confirmed on a real Mac: hotkey, microphone, sticky creation, drag and delete. Still unverified: denied microphone, silence, Space switching, relaunch, start after a real login.
- **Distribution signing never ran.** Local builds are signed with a self-signed certificate (`mac/packaging/build_dev.sh`), which keeps the microphone permission across rebuilds but is not trusted on other Macs. `release.sh` (Developer ID and notarization) exists but no certificate is known, so a clean-Mac install is unproven.
- **Privacy.** With a Gemini key set, note text and category names leave the Mac when a category was asked for in words. Recorded audio used to stay in temporary folders (fixed: it is now deleted after the upload attempt). On the free Gemini tier, Google's terms allow it to use submitted content to improve products and let human reviewers read it.
- **No access control.** The backend has no authentication (a search of `backend/app` for auth, cors and token finds nothing). It listens on `127.0.0.1` only when started by the LaunchAgent (`deploy/dev.stick.backend.plist:13-16`). Started by hand with the README command, it uses uvicorn's default host.
- **Slow classifier.** Gemini answered in 2 to 3 s at first but took 13 to 24 s (and once returned 503) on 2026-11-04. A failed DNS lookup is not covered by the timeout and took about 30 s. Only notes that ask for a category in words wait for it.
- **Lost audio.** If the backend is down when a note is spoken, the audio is not queued. After 3 tries the upload fails and the user must speak again (`mac/stick/api.py:87-95`).

## 2. Inputs

**Ticket (brief).** "The whole project": the STICK-1 plan in `.scratch/stick-1/implementation-plan.md`, Phases 0 to 5. Voice in, sticky out, categories from speech, nothing lost on retry, backend survives restarts, optional smart category fallback.

**Files used.** `.scratch/stick-1/implementation-plan.md`, `README.md`, `docker-compose.yml`, `deploy/`, `mac/packaging/`, all of `backend/app/`, `backend/migrations/`, all of `mac/stick/`, and the tests in `backend/tests/` and `mac/tests/`. Earlier pages `docs/STICK-1-c4.html` and `docs/STICK-1-phase0` to `phase5-c4.html` were read as context, not as truth.

**Scope.** This repository only. No adjacent repositories. This document changes no code.

**Group split**
- **In scope (built).** Recording, upload, transcription, intent parsing, categories, notes API, sticky windows (drag, saved positions, delete), launch sync, reconnect, logging, health, LaunchAgent, local and release signing, Gemini category fallback.
- **Out of scope (plan says "not planned yet").** Editing stickies, colour, offline queue, multi-user or multi-device, cloud transcription.
- **Needs agreement.** See section 15.

## 3. Current state

| Finding | Evidence | Consequence |
|---|---|---|
| The note id is created by the client before any upload. | `mac/stick/app.py:152`, `mac/stick/api.py:83-95` | Retries are safe. A repeated id returns the stored note and skips transcription. |
| The backend returns an existing note for a repeated id. | `backend/app/domain/voice.py:32-34`, `backend/app/db/repository.py:22-30` | No duplicates, even if two uploads race (insert is `ON CONFLICT DO NOTHING`). |
| Whisper is loaded once and guarded by a lock. | `backend/app/main.py:25-29`, `backend/app/speech/faster_whisper.py:12-17` | One clip is transcribed at a time. Several quick notes queue up. |
| An upload that outlives the 60 s client timeout is retried with the same id. | `mac/stick/api.py:11`, `api.py:106-107`, `api.py:92` | The timeout is treated as "unreachable". The backend may transcribe the same clip twice (wasted work), but still stores one note. |
| Category comes from two phrases, else from Gemini if asked in words. | `backend/app/domain/intent.py:7-10`, `intent.py:54-56`, `backend/app/domain/voice.py:39-40` | Ordinary notes never call Gemini. The phrase list for "asked in words" is a guess, not tested on real speech. |
| Category matching ignores case and extra spaces; a unique index settles races. | `backend/app/domain/categories.py:5-18`, `backend/migrations/versions/0001_notes_and_categories.py:20` | "Work" and "work" are one category. Gemini cannot create a new one. |
| `/health` is 200 only if the database answers. The classifier status never fails it. | `backend/app/main.py:44-54` | "Backend offline" in the app also covers a dead database. |
| The app polls `/health` every 3 s offline and every 15 s online, and re-syncs on every return. | `mac/stick/connection.py:5-6`, `mac/stick/app.py:96-101` | Stickies reappear without relaunch. Each poll runs `select 1`. |
| Stickies are drawn once per note id. The ✕ button deletes a note (`DELETE /notes/{id}`, 204 even if already gone) and the sticky closes only after the backend answers. Stickies can be dragged, and the position is saved on this Mac (`NSUserDefaults`, `mac/stick/settings.py` `PositionStore`). | `mac/stick/sticky.py:30-110`, `mac/stick/app.py:150-162`, `backend/app/api/notes.py:122-128` | A failed delete leaves the sticky and shows the error in the menu. A saved spot that is no longer on any screen falls back to automatic placement. Positions are not synced between Macs. |
| The app keeps no notes of its own. | `mac/stick/app.py:1`, `mac/stick/sync.py:4-6` | One source of truth (the database). No local queue for offline use. |
| Recorded audio is written to a temporary folder and deleted after the upload attempt ends (fixed after this review). | `mac/stick/recorder.py` (`discard_recording`), `mac/stick/app.py` (`upload`) | Recordings no longer accumulate. Before the fix they stayed in the temp area. |
| Audio is limited to 10 MB and 60 s; empty speech gives 422. | `backend/app/api/limits.py:6-31`, `backend/app/api/notes.py:92-97` | Clear errors. The app shows the message from the backend. |
| A database connection is held during transcription and the Gemini call (now up to 8 s per note). | `backend/app/db/session.py:19-27`, `backend/app/domain/voice.py:31-45` | Fine for one user. Many parallel uploads would hold many connections (not measured). |
| Database runs in Docker on host port 5433 and restarts with Docker Desktop. | `docker-compose.yml:2-9`, `README.md:53` | Backend start also depends on Docker Desktop starting at login (not verified on a fresh login). |
| Whisper is told to expect English (`WHISPER_LANGUAGE`, default `en`; empty means auto-detect). | `backend/app/main.py:26`, `backend/app/speech/faster_whisper.py:10-17` | Auto-detect guessed Russian (probability 0.68) on a short clip and produced nonsense. Other languages need the variable set, and the phrase parser knows only English. |
| The global hotkey is Ctrl+Option+R, registered with Carbon `RegisterEventHotKey`. | `mac/stick/hotkey.py:1-58` | No Input Monitoring permission is needed, and the system takes the key press (an earlier `NSEvent` monitor needed the permission and never fired without it). |
| The first run downloads the Whisper model from the internet. | `README.md:59` | An offline first start fails to load the model. |

## 7. Sequence diagrams

### 7.1 Happy path: voice note to sticky

```mermaid
sequenceDiagram
  actor U as User
  participant A as Stick.app
  participant B as Backend API
  participant W as Whisper
  participant D as PostgreSQL
  U->>A: Ctrl+Option+R, speak, press again
  A->>A: record WAV, make note id (uuid)
  A->>B: POST /notes/voice (id, audio)
  B->>B: check size and length
  B->>D: get note by id (none)
  B->>W: transcribe
  W-->>B: text
  B->>B: parse intent, maybe ask classifier
  B->>D: insert note (ON CONFLICT DO NOTHING)
  B-->>A: 201 note (id, text, category, created_at)
  A->>U: new sticky on the desktop
```

The id exists before the upload, which is what makes every later retry safe.

### 7.2 Failure: backend is down at launch, then comes back

```mermaid
sequenceDiagram
  participant A as Stick.app
  participant M as Connection Monitor
  participant L as launchd
  participant B as Backend API
  A->>M: start
  M->>B: GET /health
  B--xM: connection refused
  M-->>A: offline
  A->>A: icon warning, status "Backend offline"
  L->>B: start backend (login or restart after crash)
  loop every 3 s while offline
    M->>B: GET /health
  end
  B-->>M: 200 ok
  M-->>A: online
  A->>B: GET /notes
  B-->>A: all notes
  A->>A: draw stickies, icon back to normal
```

The app never needs a relaunch. After the first success it checks every 15 s.

### 7.3 Failure: slow upload, repeated call, race

```mermaid
sequenceDiagram
  participant A as Stick.app
  participant B as Backend API
  participant W as Whisper (one at a time)
  participant D as PostgreSQL
  A->>B: POST /notes/voice (id=X)
  B->>W: transcribe (slow)
  Note over A: 60 s timeout, seen as unreachable
  A->>B: retry POST /notes/voice (id=X)
  B->>D: get note X (not saved yet)
  B->>W: transcribe again (waits for the lock)
  W-->>B: text (first request)
  B->>D: insert X
  W-->>B: text (second request)
  B->>D: insert X (conflict, ignored)
  B-->>A: 200 existing note X
  A->>A: show note once (dedup by id)
```

Result: one note, one sticky. The cost is a second transcription of the same clip. A shorter wait for the lock or an in-flight check would remove it, but it is not needed for correctness.

### 7.4 Failure: Gemini is slow, wrong, or has no key

```mermaid
sequenceDiagram
  participant B as Voice Note Service
  participant C as Gemini Classifier
  participant G as Gemini API
  participant D as PostgreSQL
  B->>B: parser found no name, text asked for a category
  B->>D: list existing category names
  alt no categories yet or no key
    B->>D: save note without category
  else call Gemini
    B->>C: classify(text, names)
    C->>G: HTTPS, forced JSON, timeout 8 s
    alt error, timeout, bad JSON, or name not in list
      C-->>B: none
    else valid existing name
      C-->>B: name
    end
    B->>D: save note (category or none)
  end
```

The note is always saved. The classifier can only return a name from the list, so it cannot create categories. The timeout does not cover a failed DNS lookup, which took about 30 s once.

### 7.5 Failure: delete while the backend is down

```mermaid
sequenceDiagram
  actor U as User
  participant A as Stick.app
  participant B as Backend API
  participant D as PostgreSQL
  U->>A: click the cross on a sticky
  A->>B: DELETE /notes/id
  alt backend unreachable or error
    B--xA: no answer
    A->>A: keep the sticky, show the message in the menu
  else ok
    B->>D: delete where id
    B-->>A: 204 (also when the note was already gone)
    A->>A: close the sticky
  end
```

The sticky closes only after the backend confirms, so a deleted note cannot come back after a relaunch. Deleting twice is safe.

## 8. State diagram

The notes themselves never change after saving. The lifecycle that matters is the app's recording state.

```mermaid
stateDiagram-v2
  [*] --> Offline: app starts
  Offline --> Idle: health check ok, sync done
  Idle --> Offline: health check fails
  Idle --> Recording: hotkey and microphone allowed
  Idle --> Denied: hotkey and microphone refused
  Denied --> Idle: next hotkey press
  Recording --> Uploading: hotkey again
  Uploading --> Idle: sticky shown
  Uploading --> Idle: error message shown, audio lost
```

An upload failure goes back to Idle with the backend's message in the menu. There is no "queued" state, which is the missing piece for offline use.

## 9. Data model and contract

```mermaid
erDiagram
  CATEGORIES ||--o{ NOTES : "has"
  CATEGORIES {
    int id PK
    text name "as first spoken"
    text normalized_name UK "casefolded, spaces collapsed"
  }
  NOTES {
    uuid id PK "made by the client"
    text text
    int category_id FK "nullable"
    timestamptz created_at "server default now"
  }
```

| Value | Type | Where it comes from |
|---|---|---|
| `note.id` | uuid | Generated by the app before upload (`mac/stick/api.py:46`). |
| `note.text` | text | Whisper output with the category phrase removed (`backend/app/domain/intent.py`). |
| `note.category` | text or null | Spoken phrase, else Gemini choice (existing or new name), else null (`backend/app/domain/voice.py:36-41`). |
| `note.created_at` | timestamptz | Database default (`backend/app/db/models.py:26`). |
| Backend URL | string | `NSUserDefaults`, default `http://127.0.0.1:8000` (`mac/stick/settings.py:3-8`). |

| Endpoint | In | Out |
|---|---|---|
| `POST /notes/voice` | form: `id` (uuid), `audio` (file) | 201 new note, 200 existing note, 413 too big, 422 unreadable, too long, or no speech |
| `POST /notes` | json: `id`, `text`, optional `category` | 201 or 200 note |
| `GET /notes` | none | notes, oldest first |
| `DELETE /notes/{id}` | none | 204, also when the note does not exist |
| `GET /categories` | none | list of names |
| `GET /health` | none | 200 `{status, classifier{provider, status}}` or 503 |

## 10. Options comparison

| | A: Python app + local Python backend (built) | B: One native Swift app, SQLite, no backend | C: Hosted backend in the cloud |
|---|---|---|---|
| What changes | Nothing, this is the current design. | Rewrite the app in Swift, run Whisper in the app, drop FastAPI and PostgreSQL. | Move the backend and database to a server, add login. |
| Pros | One language. Backend testable alone with real PostgreSQL. Matches the plan and passed its spikes. Clean path to more clients later. | One process, no Docker, no LaunchAgent, simplest install. | Multi-device, no local database to run. |
| Cons | Two processes and Docker to keep running. py2app packaging is fragile. Whisper RAM (about 0.8 GB). | Throws away built and tested code. Swift expertise needed. Whisper in Swift is a separate project. | Audio and notes leave the Mac. Needs auth, hosting, cost. Out of scope in the plan. |
| Size | 0 now. | Large rewrite (a rewrite of about 1,340 lines of Python source today). | Large (auth, deploy, security). |
| Risks | Install friction on a clean Mac (unproven). | Schedule, regressions. | Privacy and security. |

**Recommendation: A.** It is built, tested (70 backend and 21 Mac tests) and fits the constraints: private by default, one language, and simple pieces. Spend the next effort on verification (section 14), not on a new structure.

## 11. ADR

| Decision | Rejected alternative | Reason |
|---|---|---|
| Python for app and backend, PyObjC for AppKit. | Swift for the app. | Spike A passed: desktop-level panel, all Spaces, hotkey, microphone, py2app (plan: Phase 0). |
| Client-made note id plus `ON CONFLICT DO NOTHING`. | Server-made ids with a de-duplication table. | Retries and races give one note with no extra table (`backend/app/db/repository.py:22-30`). |
| Local faster-whisper `small`, int8, loaded once. | Cloud transcription. | Private, no quota, about 7x faster than real time on the dev Mac (plan, Spike C). |
| Intent Parser as a pure function first, model only as a fallback. | Always asking a model. | Fast, free, testable. Ordinary notes never leave the machine. |
| Gemini behind an interface, opt-in by `GEMINI_API_KEY`. | Local Ollama 3B or 1B. | 3B needs about 2.6 GB loaded. 1B answered "Home" for nearly everything in testing. Interface keeps a local model possible later. |
| Forced JSON reply with an enum of existing names plus "none". | Free text parsing. | Nothing to parse, and no invented categories. |
| Global hotkey through Carbon `RegisterEventHotKey` (Ctrl+Option+R). | `NSEvent` global monitor on Ctrl+Option+Space. | The monitor needs Input Monitoring (not granted, so it never fired), cannot take the key from the system, and the old key combination is also a system shortcut. |
| Local builds signed with a self-signed certificate (`build_dev.sh`). | Ad-hoc signature (the py2app default). | An ad-hoc signature changes with every build, so macOS asked for the microphone again each time. |
| Whisper language fixed to English by default (`WHISPER_LANGUAGE`). | Auto-detect. | Auto-detect picked Russian for a short clip and produced nonsense. |
| A sticky closes only after the backend confirms the delete. | Closing at once. | A failed delete would otherwise come back on relaunch. |
| `/health` checks the database. Classifier status never fails it. | Plain "ok". | Honest offline state in the app, and a Gemini outage is not "backend down". |
| Plain polling of `/health` by the app. | Push or websocket. | Simplest, enough for one user (3 s and 15 s). |
| Backend as a per-user LaunchAgent, database in Docker. | Login item, or Homebrew PostgreSQL service. | Restarts after crash, no root. Docker keeps the database off the user's own PostgreSQL (port 5433). |

## 12. Non-functional requirements

- **Privacy.** Audio and text stay on the Mac. Exceptions: Gemini (note text and category names, only if a key is set and a category was asked for in words) and the first Whisper model download. Logs hold note ids and timings, not note text (`backend/app/api/notes.py:93-100`). Temporary audio is deleted after each upload attempt.
- **Security.** No authentication. Safe only while the backend listens on `127.0.0.1`. The API key belongs in `.env` or the LaunchAgent environment, never in the repository (`.env` is git-ignored).
- **Reliability.** Backend restarts by itself (`KeepAlive`). The app reconnects and redraws. A classifier failure never blocks a note. Gap: audio is lost when the backend is down for more than the 3 tries.
- **Idempotency.** Same note id gives the same note (tests: `backend/tests/test_voice_api.py`, `test_notes_api.py`).
- **Performance.** Whisper about 1.3 s for an 8.8 s clip (plan, Spike C). A voice note took 1.5 s end to end in a local run. Gemini adds 2 to 3 s when it runs, but 13 to 24 s were seen on 2026-11-04, and a failed DNS lookup took about 30 s (the 8 s timeout does not cover it). Transcription is serial because of the lock.
- **Environments.** Python 3.13 only (`av` must stay below 19). macOS with Microphone permission (no Input Monitoring). Docker Desktop for PostgreSQL. Tests use a separate `stick_test` database.
