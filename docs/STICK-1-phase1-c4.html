# STICK-1 Phase 1: Backend core, text only — C4 Architecture

This page shows what Phase 1 adds to the backend: stored notes and categories, reachable over HTTP with plain text (no audio). Chosen option: a layered Python backend (Router → Services → Repository) on PostgreSQL, built test-first.

## The idea in 30 seconds

**Problem.** The backend today answers only `GET /health` (`backend/app/main.py:6-8`). It has no database code: no database libraries are listed (`backend/pyproject.toml:5-8`), the `DATABASE_URL` setting is not read by any code (`.env.example:2`), and the PostgreSQL container has no tables. Nothing can store or return a note.

**Principle.** Each layer has one job: the Router handles HTTP, the services hold the rules, the Repository is the only code that writes SQL. The database enforces uniqueness, so repeated or parallel requests cannot create duplicates.

**Result.** With `curl`, a developer can create a note with a client-made id, file it under a category, and list notes and categories. Sending the same note id twice returns the same note. "Work" and "work" are one category.

## New elements (green boxes)

Every green box on Level 3 has one card below. The evidence for "Why" is mostly that the code does not exist yet, so each card names the file that shows it.

<div class="cards">
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Notes Router</h3>
<p class="what"><b>What it is.</b> The HTTP layer. It reads requests, calls the services and returns JSON.</p>
<p class="why"><b>Why we add it.</b> The only route today is <code>/health</code> (<code>backend/app/main.py:6-8</code>). A developer, and later the Mac app, has no way to create or list notes.</p>
<p><b>How it works.</b></p>
<ul>
<li><code>POST /notes</code> takes the text, an optional category name and the note id.</li>
<li><code>GET /notes</code> and <code>GET /categories</code> return what is stored. An empty list is a valid answer.</li>
<li>Holds no business rules. It only calls the services.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/api/notes.py</code> (planned path), mounted in <code>main.py</code>.</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Note Service</h3>
<p class="what"><b>What it is.</b> The place where a note is created and listed.</p>
<p class="why"><b>Why we add it.</b> The app will retry uploads, and the note id is made by the client so a retry is safe. Nothing enforces one note per id: there is no note code or table (<code>backend/app/</code> holds only <code>main.py</code>).</p>
<p><b>How it works.</b></p>
<ul>
<li>Creates a note with the id sent by the client.</li>
<li>If the id already exists, returns the existing note and does not insert again.</li>
<li>Asks Category Service for a category only when a name was given.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/domain/notes.py</code> (planned path).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Category Service</h3>
<p class="what"><b>What it is.</b> Finds a category by name or creates it.</p>
<p class="why"><b>Why we add it.</b> Categories will come from speech, so "Work", "work" and "Work " must be one category. There is no category code today (<code>backend/app/main.py</code> is the only module).</p>
<p><b>How it works.</b></p>
<ul>
<li>Normalizes the name: ignores case and extra spaces.</li>
<li>Calls "find or insert" in the Repository.</li>
<li>Leans on the unique name in PostgreSQL, so two parallel requests cannot create two rows.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/domain/categories.py</code> (planned path).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Repository</h3>
<p class="what"><b>What it is.</b> The only code that sends SQL to PostgreSQL.</p>
<p class="why"><b>Why we add it.</b> No database library is a dependency yet (<code>backend/pyproject.toml:5-8</code>) and <code>DATABASE_URL</code> is read by no code (<code>.env.example:2</code>). Keeping SQL in one place also keeps the services simple.</p>
<p><b>How it works.</b></p>
<ul>
<li>Four methods: save note, get note, list notes, find or insert category.</li>
<li>Reads the connection string from <code>DATABASE_URL</code>.</li>
<li>Adds the database libraries to the backend dependencies. Which libraries is not decided in the plan.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/db/</code> (planned path).</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Alembic Migration</h3>
<p class="what"><b>What it is.</b> A versioned script (Alembic is the usual Python migration tool) that creates the tables.</p>
<p class="why"><b>Why we add it.</b> The PostgreSQL container starts empty: <code>docker-compose.yml:2-3</code> sets up only the server and the <code>stick</code> database (<code>.env.example:5</code>). Without tables nothing can be saved.</p>
<p><b>How it works.</b></p>
<ul>
<li><code>categories</code>: id and a unique normalized name.</li>
<li><code>notes</code>: id supplied by the client, text, nullable <code>category_id</code>, <code>created_at</code>.</li>
<li>Run once with <code>alembic upgrade head</code>. Tests use the same migration.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/migrations/</code> and <code>backend/alembic.ini</code> (planned paths).</p>
</div>
</div>
