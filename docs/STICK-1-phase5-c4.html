# STICK-1 Phase 5: LLM Classifier — C4 Architecture

This page shows what Phase 5 adds so a spoken request like "put this with my work stuff" gets a category. Chosen option: a small adapter that asks a local Ollama model, called only when the user asked for a category but the Intent Parser found no name.

## The idea in 30 seconds

**Problem.** Today a category is set only when the user says "in category X" or "categorize as X" (`backend/app/domain/intent.py:7-10`). Any other phrasing gives no category, and the parser returns the same `None` whether the user asked for nothing or asked in other words (`intent.py:18-19`, `intent.py:33-34`). No code in the backend talks to a language model (a search of `backend`, `mac` and `deploy` for "ollama" finds nothing).

**Principle.** The parser stays the fast, free first choice. The model is a fallback behind an interface, runs only on this machine, and may fail at any time without affecting the note.

**Result.** "Put this with my work stuff" is filed under the existing Work category. If Ollama is off, slow or confused, the sticky is still created, just without a category.

- Notes with "in category X", notes with no category request, and repeated uploads of the same note id work as before. A retry still returns the stored note before any model call.
- Voice Note Service gets one more step between parsing and saving. Notes Router only passes the classifier in.
- Health Check adds an Ollama line to its answer. It still returns 200 when only Ollama is down, so the app does not show "backend offline" for it.

## New elements (green boxes)

Every green box on Level 3 has one card below. There are no green boxes on Levels 1 and 2.

<div class="cards">
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Category Request Detector</h3>
<p class="what"><b>What it is.</b> A pure function (text in, yes or no out) that says whether the user asked for a category in words, such as "put this with my work stuff" or "file this under shopping".</p>
<p class="why"><b>Why we add it.</b> The Intent Parser returns <code>(text, None)</code> both when nothing was asked and when a request had no usable name (<code>backend/app/domain/intent.py:18-19</code>, <code>intent.py:27-28</code>, <code>intent.py:33-34</code>), and its trigger knows only two phrases (<code>intent.py:7-10</code>). The plan says the model must run only when a category was asked for, so the pipeline needs that fact on its own.</p>
<p><b>How it works.</b></p>
<ul>
<li>Runs after the Intent Parser, and only when the parser found no name.</li>
<li>Matches a short list of request phrases. The plan does not define the list, so it must be chosen and tested with table tests, as for the parser.</li>
<li>No match means no model call, so ordinary notes cost nothing extra.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/domain/intent.py</code> next to <code>parse_intent</code>, with table tests in <code>backend/tests/test_intent.py</code>. Keep <code>parse_intent</code> unchanged.</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Category Classifier</h3>
<p class="what"><b>What it is.</b> An interface (a Python <code>Protocol</code>): note text and existing category names in, one existing name or nothing out.</p>
<p class="why"><b>Why we add it.</b> The pipeline today has one swappable engine behind an interface, the Transcriber (<code>backend/app/speech/transcriber.py:5-8</code>), and the plan wants the same for classification so tests use a fake and the provider can change. There is no such seam for categories now (<code>backend/app/domain/voice.py:14-29</code> only knows the Transcriber).</p>
<p><b>How it works.</b></p>
<ul>
<li>One method, for example <code>classify(text, categories) -&gt; str | None</code>.</li>
<li>Returns only a name from the given list. Any other answer becomes <code>None</code>.</li>
<li>Never raises to the caller: failure means <code>None</code>.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/classify/classifier.py</code> (new package, like <code>app/speech</code>). Tests use a fake class.</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Ollama Classifier</h3>
<p class="what"><b>What it is.</b> The only implementation of the Category Classifier. It sends one request to Ollama on localhost and reads the answer.</p>
<p class="why"><b>Why we add it.</b> Nothing in the repo calls Ollama or any model (no match for "ollama" in <code>backend</code>, <code>mac</code>, <code>deploy</code>). Spike C measured that <code>llama3.2:3b</code> picked a sensible category for 3 of 3 sample notes, at 0.3 to 0.5 s warm and 4.6 s on the first call (<code>.scratch/stick-1/implementation-plan.md:16</code>).</p>
<p><b>How it works.</b></p>
<ul>
<li>Sends the note text and the category names, and asks for a reply shaped as <code>{"category": "..."}</code>. Using the existing names as the allowed values in the schema is the plan to keep answers valid; Ollama's support for this is not verified in this repo.</li>
<li>Times out after a few seconds. Connection error, timeout, bad JSON or a name not in the list all return <code>None</code>.</li>
<li>Skips the call when no categories exist yet. Matching ignores case and spaces, like <code>normalize</code> (<code>backend/app/domain/categories.py:5-6</code>).</li>
<li>Model name, URL and timeout come from environment variables. The first call after Ollama idles can exceed a short timeout (4.6 s cold load).</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/classify/ollama.py</code>, built once in <code>backend/app/main.py</code> next to the transcriber (<code>main.py:19-29</code>). Install and <code>ollama pull</code> steps go in <code>README.md</code>.</p>
</div>
</div>
