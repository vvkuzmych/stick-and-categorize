# STICK-1 Phase 5: LLM Classifier — C4 Architecture

This page shows what Phase 5 adds so a spoken request like "put this with my work stuff" gets a category. Chosen option: a small adapter that asks Google's Gemini API, called only when the user asked for a category but the Intent Parser found no name. The plan named a local Ollama model; it was dropped because of its memory cost (about 2.6 GB loaded).

## The idea in 30 seconds

**Problem.** Today a category is set only when the user says "in category X" or "categorize as X" (`backend/app/domain/intent.py:7-10`). Any other phrasing gives no category, and the parser returns the same `None` whether the user asked for nothing or asked in other words (`intent.py:25`, `intent.py:34`, `intent.py:40`). Before Phase 5 no backend code talked to a language model.

**Principle.** The parser stays the fast, free first choice. The model is a fallback behind an interface, it may only pick an existing category, and it may fail at any time without affecting the note.

**Result.** "Put this with my work stuff" is filed under the existing Work category. With no API key, no internet, a timeout or a bad answer, the sticky is still created, just without a category. The cost is that the note text and category names go to Google when this fallback runs.

- Notes with "in category X", notes with no category request, and repeated uploads of the same note id work as before. A retry still returns the stored note before any Gemini call.
- Voice Note Service gets one more step between parsing and saving. Notes Router only passes the classifier in.
- Health Check adds the classifier provider and status. It makes no network call (to save free-tier quota) and never turns a classifier problem into a 503.

## New elements (green boxes)

Every green box on Level 3 has one card below. There are no green boxes on Levels 1 and 2.

<div class="cards">
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Category Request Detector</h3>
<p class="what"><b>What it is.</b> A pure function (text in, yes or no out) that says whether the user asked for a category in words, such as "put this with my work stuff" or "file this under shopping".</p>
<p class="why"><b>Why we add it.</b> The Intent Parser returns <code>(text, None)</code> both when nothing was asked and when a request had no usable name (<code>backend/app/domain/intent.py:25</code>, <code>intent.py:34</code>, <code>intent.py:40</code>), and its trigger knows only two phrases (<code>intent.py:7-10</code>). The plan says the model must run only when a category was asked for, so the pipeline needs that fact on its own.</p>
<p><b>How it works.</b></p>
<ul>
<li>Runs after the Intent Parser, and only when the parser found no name.</li>
<li>Matches "categorize", "category", verbs like put, file or stick followed by this, it or that, and "this goes with". The list is mine, not the plan's, and is covered by table tests with false-positive cases such as "Add milk to the shopping list".</li>
<li>No match means no Gemini call, so ordinary notes cost nothing and send nothing.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/domain/intent.py</code> (<code>asks_for_category</code>), tests in <code>backend/tests/test_intent.py</code>. <code>parse_intent</code> is unchanged.</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Category Classifier</h3>
<p class="what"><b>What it is.</b> An interface (a Python <code>Protocol</code>): note text and existing category names in, one of those names (or nothing) out. It also reports a provider name and a cheap status for <code>/health</code>.</p>
<p class="why"><b>Why we add it.</b> The pipeline has one swappable engine behind an interface, the Transcriber (<code>backend/app/speech/transcriber.py:5-8</code>), and the plan wants the same for classification so tests use a fake and the provider can change again. Before Phase 5 <code>VoiceNoteService</code> knew only the Transcriber (<code>backend/app/domain/voice.py:14-29</code> in the Phase 2 version).</p>
<p><b>How it works.</b></p>
<ul>
<li>One method, <code>classify(text, categories) -&gt; str | None</code>. It must never raise.</li>
<li>Helpers in the same file match an answer to an existing name (ignoring case and spaces) and send JSON over HTTP.</li>
<li>Voice Note Service also guards the call, so a faulty classifier cannot lose a note.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/classify/classifier.py</code> (new package, like <code>app/speech</code>). Tests use a fake class in <code>backend/tests/test_voice_api.py</code>.</p>
</div>
<div class="card t1">
<div class="card-head"><span class="badge">NEW</span><span class="tier">Tier 1</span></div>
<h3>Gemini Classifier</h3>
<p class="what"><b>What it is.</b> The only implementation of the Category Classifier. It sends one HTTPS request to the Gemini API and reads the answer.</p>
<p class="why"><b>Why we add it.</b> No backend code called a language model before (<code>backend/app/main.py</code> loaded only Whisper). The local option from the plan, a 3B Ollama model, needs about 2.6 GB of memory (<code>.scratch/stick-1/implementation-plan.md:16</code>), and a 1B model was tested and answered "Home" for nearly everything. A hosted model costs no local memory.</p>
<p><b>How it works.</b></p>
<ul>
<li>Sends the note text and category names, and forces a JSON reply whose <code>category</code> can only be an existing name or "none", so it cannot invent a category. The API key goes in a header, not in the URL.</li>
<li>Times out after a few seconds (<code>GEMINI_TIMEOUT</code>, default 5). Connection error, HTTP error, bad JSON or an unknown name all return nothing, and the note is saved without a category.</li>
<li>Skips the call when no categories exist. Without <code>GEMINI_API_KEY</code> the backend starts with no classifier.</li>
<li>Verified live: Google retired the older <code>generateContent</code> call (it returns 404 for every model), so the adapter uses the newer Interactions API (<code>/v1beta/interactions</code>, default model <code>gemini-3.5-flash-lite</code>). A call takes about 2 to 3 seconds. Free-tier limits and data use were not checked.</li>
</ul>
<p class="where"><b>Where.</b> <code>backend/app/classify/gemini.py</code>, built once in <code>backend/app/main.py</code> next to the transcriber. Setup and the privacy note are in <code>README.md</code> (Phase 5).</p>
</div>
</div>
